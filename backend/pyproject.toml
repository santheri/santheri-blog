[project]
name = "santheri-blog-backend"
version = "0.1.0"
description = "FastAPI backend for Santheri's Personal Blog connected to Neon.tech PostgreSQL"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "markdown>=3.6.0",
]

[tool.uv]
package = false
